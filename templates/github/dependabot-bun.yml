version: 2
updates:
  # "bun" requires Bun >= 1.1.39 and the text lockfile bun.lock.
  - package-ecosystem: "bun"
    # For monorepos, use `directories:` with globs instead of `directory:`.
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    # For monorepos, use `directories:` with globs instead of `directory:`.
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
